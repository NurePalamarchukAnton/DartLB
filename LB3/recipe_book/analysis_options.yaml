# Аналіз для recipe_book (ЛР3): recommended + async-лінти та суворіші правила.
# public_member_api_docs свідомо не вмикаю: для primary constructors у Dart 3
# лінт хибно вимагає окремий /// на оголошенні класу навіть за наявності
# класової документації; тому документи публічних членів тримаю вручну.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_const_declarations: true
    prefer_final_locals: true
    directives_ordering: true
    unawaited_futures: true
    discarded_futures: true
    avoid_returning_null_for_void: true
    cancel_subscriptions: true
    close_sinks: true
    # bin/ і демо async* використовують print для навчального виводу.
    avoid_print: false
